  <title>PI 27.1 Run Map</title>
  
  <!-- Local copies of MapLibre GL JS -->
  <script src="lib/maplibre-gl.5.10.0.js"></script>
  <link href="lib/maplibre-gl.5.10.0.css" rel="stylesheet" />

  <!-- PMTiles support -->
  <script src="lib/pmtiles.4.3.0.js"></script>
  
  <style>
    /* Required CSS statements defining the map to be the full size of the viewport*/
    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="map"></div>
 
  <script>
    // Initialize PMTiles protocol
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    // Javascript to create a new map using Maplibre GL JS
    const map = new maplibregl.Map({
    container: 'map',
    style: {
        'version': 8,
        'sources': {
            'osm-tiles': {
                'type': 'raster',
                'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                'tileSize': 256,
                'attribution': '© OpenStreetMap contributors'
            },
            'run': {
                'type': 'geojson',
                'data': 'sources/run.geojson'
            }
        },
        'layers': [
            {
                'id': 'osm-layer',
                'type': 'raster',
                'source': 'osm-tiles',
                'minzoom': 0,
                'maxzoom': 19
            },
            {
                id: 'run',
                type: 'line',
                source: 'run',
                paint: { 
                  "line-color": "#e41f18",
                  "line-width": 3,
                  "line-dasharray": [2, 2] }
            },
            {
                id: 'run-hover',
                type: 'line',
                source: 'run',
                layout: { visibility: 'none' },
                paint: {
                  "line-color": "#b81515",
                  "line-width": 3,
                  "line-dasharray": [2, 2]
                }
            }
        ]
    },
    center: [144.97, -37.83], // Docklands, Melbourne
    zoom: 15
    });
    
      // Add navigation controls
    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    
    // Add scale bar
    map.addControl(new maplibregl.ScaleControl({
      maxWidth: 100,
      unit: 'metric'
      }), 'bottom-left');
    // Swap between run layers on hover
    map.on('mouseenter', 'run', function() {
      map.setLayoutProperty('run', 'visibility', 'none');
      map.setLayoutProperty('run-hover', 'visibility', 'visible');
      });
    map.on('mouseleave', 'run-hover', function() {
      map.setLayoutProperty('run', 'visibility', 'visible');
      map.setLayoutProperty('run-hover', 'visibility', 'none');
      });
